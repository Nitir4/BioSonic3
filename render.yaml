# render.yaml — Unified Deployment (Backend + Frontend)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: biosonic-backend
    runtime: docker
    # We use the root Dockerfile for the unified build
    dockerfilePath: Dockerfile
    # Context is the entire root so both folders are available
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MODEL_CACHE_PATH
        value: model_cache.pkl
      - key: DATASET_PATH
        value: data/train_audio
