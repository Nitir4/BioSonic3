services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    container_name: biosonic-backend
    ports:
      - "8080:8080"
    environment:
      ALLOWED_ORIGINS: "http://localhost:3000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
      args:
        VITE_API_URL: "http://localhost:8080"
    container_name: biosonic-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
